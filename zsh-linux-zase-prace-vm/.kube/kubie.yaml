# kubie config for the zase-prace VM.
#
# Differs from the macOS ../kubie package in one respect: the built-in prompt
# is disabled, because this host's starship config already renders the
# kubernetes context via its [kubernetes] module. Leaving both on shows the
# context twice.

default_editor: nvim

configs:
    # One file per cluster. Nothing is ever merged onto disk — kubie reads
    # these and hands each subshell its own temporary KUBECONFIG.
    include:
        - ~/.kube/configs/*.yml
        - ~/.kube/configs/*.yaml

    exclude:
        - ~/.kube/kubie.yaml
        # The scratch file that absorbs stray `kubectl config` writes. It is
        # part of the merged KUBECONFIG built in .zshrc.d/55-kubernetes.zsh,
        # but it holds no cluster definitions, so kubie must ignore it.
        - ~/.kube/config

prompt:
    # starship owns the context display on this host.
    disable: true
    show_depth: true
    zsh_use_rps1: false

behavior:
    validate_namespaces: true
    print_context_in_exec: auto

hooks:
    # Put the context/namespace in the terminal title, so a tab is
    # identifiable even when scrolled away from the prompt.
    start_ctx: >
        echo -en "\033]1; `kubie info ctx`|`kubie info ns` \007"
    stop_ctx: >
        echo -en "\033]1; $SHELL \007"
