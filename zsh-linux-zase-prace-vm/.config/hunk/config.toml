# hunk (hunk.dev) — https://github.com/modem-dev/hunk
#
# Hunk 0.23's terminal theme inherits the terminal foreground, background and
# ANSI palette, then repaints when the terminal reports an appearance change.
# Ghostty supplies Catppuccin Latte/Mocha through that palette, so console and
# Herdr-launched reviews no longer need a separate theme-detection wrapper.
theme = "terminal"

# Layout, not appearance: auto | split | stack.
mode = "auto"

vcs = "git"
watch = false
exclude_untracked = false
line_numbers = true
tab_width = 4
wrap_lines = true
hunk_headers = true
menu_bar = true
agent_notes = true
transparent_background = false
copy_decorations = false
cursor_line = "row"
