"$schema" = 'https://starship.rs/config-schema.json'

# Prompt for the "zase-prace" Debian work VM.
#
# The point of this file is that stibi@zase-prace is ALWAYS shown, in bold
# mauve. Other Debian boxes get the stock prompt, so a glance at the first
# characters of the line tells you which machine you are on.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$kubernetes\
$cmd_duration\
$line_break\
$status\
$character"""

add_newline = true
palette = "catppuccin_mocha"

# --- the host badge ----------------------------------------------------

[username]
show_always = true            # not just for root / SSH
format = '[$user]($style)'
style_user = 'bold mauve'
style_root = 'bold red'       # unmistakable when you are root

[hostname]
ssh_only = false              # this is the whole point — always visible
format = '[@$hostname]($style) '
style = 'bold mauve'

# --- context -----------------------------------------------------------

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold blue'
read_only = ' 󰌾'
read_only_style = 'red'
truncation_length = 4
truncate_to_repo = false
truncation_symbol = '…/'

[git_branch]
format = '[$symbol$branch]($style) '
symbol = ' '
style = 'bold green'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = 'bold peach'

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = 'bold peach'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '$'
modified = '✱${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = '☸ '
style = 'bold sky'

[cmd_duration]
min_time = 500
format = 'took [$duration]($style) '
style = 'bold yellow'

# --- second line -------------------------------------------------------

[status]
disabled = false
symbol = '🔴 '
success_symbol = '🟢 '
format = '[$symbol$common_meaning$signal_name$maybe_int]($style)'
map_symbol = true
style = 'bold red'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

# --- palette -----------------------------------------------------------

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
