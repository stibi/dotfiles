onboarding = false

[ui]
agent_panel_sort = "priority"
sidebar_width = 32
sidebar_min_width = 24
sidebar_max_width = 48
pane_borders = "always"
pane_outer_borders = true
pane_gaps = false

[ui.toast]
delivery = "herdr"
delay_seconds = 2

[ui.toast.herdr]
position = "bottom-right"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[keys]
# prefix = "ctrl+a"
prefix = "`"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "review changes with hunk"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "send hunk review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "review last commit with hunk"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "review staged changes with hunk"
